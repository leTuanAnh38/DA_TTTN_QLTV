{% extends 'core/base.html' %}
{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="fw-bold mb-4 text-dark">{{ title }}</h2>
                    <form method="POST" class="row g-3">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="col-12">
                            <label class="form-label fw-bold small text-uppercase text-muted">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}
                        
                        <div class="col-12 mt-4 pt-3 border-top">
                            <button type="submit" class="btn btn-success rounded-pill px-5 fw-bold">Lưu lại</button>
                            <a href="javascript:history.back()" class="btn btn-light rounded-pill px-4 ms-2">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
